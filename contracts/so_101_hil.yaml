# so_101 with human-in-the-loop: teleop intervention + reward classifier.
# See stone.yaml for the annotated tour of the contract format.

robot_type: so_101
robot_interface: ros2
fps: 30

x-qos:
  camera: &camera_qos {reliability: best_effort, history: keep_last, depth: 10}
  state:  &state_qos  {reliability: best_effort, history: keep_last, depth: 50}
  cmd:    &cmd_qos    {reliability: best_effort, history: keep_last, depth: 10}
  event:  &event_qos  {reliability: best_effort, history: keep_last, depth: 1}

observations:
  observation.images.right:
    channel: {topic: /front_camera/image_raw/compressed,
              type: sensor_msgs/msg/CompressedImage, qos: *camera_qos}
    align: {strategy: hold, timeline: header}
    apply: [resize: [512, 512]]

  observation.images.top:
    channel: {topic: /top_camera/image_raw/compressed,
              type: sensor_msgs/msg/CompressedImage, qos: *camera_qos}
    align: {strategy: hold, timeline: header}
    apply: [resize: [512, 512]]

  observation.images.wrist.right:
    channel: {topic: /wrist_camera/image_raw/compressed,
              type: sensor_msgs/msg/CompressedImage, qos: *camera_qos}
    align: {strategy: hold, timeline: header}
    apply: [resize: [512, 512]]

  observation.state:
    channel: {topic: /follower_arm/joint_states,
              type: sensor_msgs/msg/JointState, qos: *state_qos}
    align: {strategy: hold, timeline: header}
    select: [position.shoulder_pan, position.shoulder_lift, position.elbow,
             position.wrist_pitch, position.wrist_roll, position.wrist_yaw]

actions:
  action:
    channel: {topic: /leader_arm/joint_states,
              type: sensor_msgs/msg/JointState, qos: *cmd_qos}
    align: {strategy: hold, timeline: header}
    select: [position.shoulder_pan, position.shoulder_lift, position.elbow,
             position.wrist_pitch, position.wrist_roll, position.wrist_yaw]

teleop:
  input:
    channel: {topic: /human/leader_arm/joint_states,
              type: sensor_msgs/msg/JointState, qos: *state_qos}
    align: {strategy: hold, timeline: header}
    select: [position.shoulder_pan, position.shoulder_lift, position.elbow,
             position.wrist_pitch, position.wrist_roll, position.wrist_yaw]

  events:
    channel: {topic: /joy, type: sensor_msgs/msg/Joy, qos: *event_qos}
    select: {is_intervention: buttons.10, success: buttons.0, failure: buttons.1,
             terminate_episode: buttons.2, rerecord_episode: buttons.3}

rewards:
  # Published by the reward-classifier model (its own contract; its "action"
  # is this channel). Float64 carries no header, so `receive` is the only
  # timeline this channel provides.
  next.reward:
    channel: {topic: /reward, type: std_msgs/msg/Float64,
              dtype: float64, qos: *event_qos}
    align: {strategy: hold, timeline: receive}
