robot_type: turtlebot3_waffle

fps: 30

observations:
  - key: observation.images.front
    topic: /camera/image_raw/compressed
    type: sensor_msgs/msg/CompressedImage
    apply: [resize: [224, 224]]
    align: {strategy: hold, stamp: header}
    qos: {reliability: best_effort, history: keep_last, depth: 10}

  - key: observation.images.overhead
    topic: /overhead_camera/image_raw/compressed
    type: sensor_msgs/msg/CompressedImage
    apply: [resize: [224, 224]]
    align: {strategy: hold, stamp: header}
    qos: {reliability: best_effort, history: keep_last, depth: 10}

  # observation.state concatenated from wheels + imu + odom (16 dims total)
  - key: observation.state
    topic: /joint_states
    type: sensor_msgs/msg/JointState
    select: [position.wheel_left_joint, position.wheel_right_joint, velocity.wheel_left_joint, velocity.wheel_right_joint]
    align: {strategy: hold, stamp: header}
    qos: {reliability: best_effort, history: keep_last, depth: 50}

  - key: observation.state
    topic: /imu
    type: sensor_msgs/msg/Imu
    select: [orientation.x, orientation.y, orientation.z, orientation.w, angular_velocity.x, angular_velocity.y, angular_velocity.z, linear_acceleration.x, linear_acceleration.y, linear_acceleration.z]
    dtype: float64
    align: {strategy: hold, stamp: header}
    qos: {reliability: best_effort, history: keep_last, depth: 50}

  - key: observation.state
    topic: /odom
    type: nav_msgs/msg/Odometry
    select: [twist.twist.linear.x, twist.twist.angular.z]
    dtype: float64
    align: {strategy: hold, stamp: header}
    qos: {reliability: best_effort, history: keep_last, depth: 50}

actions:
  - key: action
    topic: /cmd_vel
    type: geometry_msgs/msg/TwistStamped
    select: [linear.x, angular.z]
    serve: {safety: zeros}
    qos: {reliability: reliable, history: keep_last, depth: 10}

adjunct:
  - {topic: /tf,   type: tf2_msgs/msg/TFMessage}
  - {topic: /scan, type: sensor_msgs/msg/LaserScan}

recording:
  storage: mcap
