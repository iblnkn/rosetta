# Policy Runner Node Parameters (policy inference)
# This file is the source of truth for node configuration.
#
# Usage:
#   ros2 launch rosetta_ros policy_runner_launch.py
#
# Override at launch (launch-arg form):
#   ros2 launch rosetta_ros policy_runner_launch.py pretrained_name_or_path:=/path/to/model
#
# Or when running the node directly:
#   ros2 run rosetta_ros policy_runner_node --ros-args --params-file <this file> \
#       -p pretrained_name_or_path:=/path/to/model

policy_runner:
  ros__parameters:
    # Path to trained model (local path or HuggingFace repo_id)
    pretrained_name_or_path: "iblnk/act-turtlebot3_demo"

    # LeRobot policy server address (host:port)
    server_address: "127.0.0.1:8080"

    # Policy architecture ("act", "diffusion", ...). Empty reads it from the
    # checkpoint. Set it only when this machine can't read the checkpoint,
    # such as a path that exists only on a remote policy server.
    policy_type: ""

    # Device for policy inference: "cuda", "xpu", "mps", "cpu", or specific like "cuda:0"
    policy_device: "cuda"

    # Note: fps is defined in the contract (single source of truth)

    # Number of actions to request per inference chunk
    # Controls how often must_go=True triggers (when queue empties).
    # Server filters most non-must_go observations via similarity check (atol=1).
    # At 30Hz: actions_per_chunk=50 → ~1.67s between inferences
    #          actions_per_chunk=10 → ~0.33s between inferences
    actions_per_chunk: 30

    # Threshold for when to request new action chunk (0.0 - 1.0)
    # Controls when client SENDS observations to server.
    # Server may still FILTER them via _obs_sanity_checks (similarity + timestep).
    # Only must_go=True observations bypass filtering entirely.
    chunk_size_threshold: 0.95

    # How to aggregate overlapping action chunks
    # Options: "weighted_average" (0.3*old + 0.7*new), "latest_only" (new only),
    #          "average" (0.5*old + 0.5*new), "conservative" (0.7*old + 0.3*new)
    aggregate_fn_name: "weighted_average"

    # Task prompt used when a goal or service call leaves prompt empty.
    # For a language-conditioned policy, match what its episodes were
    # recorded with.
    default_prompt: ""

    # Default max run duration in seconds (can be overridden per-goal)
    # 0 (or negative) = run until stopped, no time limit
    default_max_duration_s: 0.0

    # Rate at which to publish execution feedback (Hz)
    feedback_rate_hz: 2.0

    # Launch local policy server automatically (set false if using remote server)
    launch_local_server: true

    # Max seconds to wait for the policy server to come up. The server is
    # started at node configure time and preloads the model before binding its
    # port, so configure blocks until the model is loaded. Raise this if the
    # first launch must download weights from the HF Hub (or pre-download with
    # `hf download <repo_id>`).
    server_startup_timeout_sec: 120.0
