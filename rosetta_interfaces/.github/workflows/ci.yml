name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # industrial_ci is Docker-native: it pulls an official ROS image and builds
  # inside it, so there's no "is ROS actually installed on this runner" class
  # of bug to hand-roll around. rosdep resolves deps straight from
  # package.xml. colcon test also runs ament_lint_cmake/ament_xmllint
  # automatically for ament_cmake packages — no separate lint step needed for
  # this package.
  industrial_ci:
    runs-on: ubuntu-latest
    env:
      ROS_DISTRO: jazzy
      ROS_REPO: main
    steps:
      - uses: actions/checkout@v4
      - uses: ros-industrial/industrial_ci@master
