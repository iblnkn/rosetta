name: pixi

# The from-source path users take: the locked pixi environment (RoboStack ROS 2
# Jazzy + LeRobot from PyPI), then `pixi run test` builds and tests every
# package together. The docs build checks the locked docs environment, which
# docs.yml otherwise only builds on main.
on:
  pull_request:
    paths: [pixi.toml, pixi.lock, pixi/**, rosetta/**, robots/**, policies/**, docs/**, .github/workflows/pixi.yml]
  push:
    branches: [main, dev]
    paths: [pixi.toml, pixi.lock, pixi/**, rosetta/**, robots/**, policies/**, docs/**, .github/workflows/pixi.yml]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.72.2
          locked: true
          environments: default docs
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
      - run: pixi run test
      - run: pixi run docs-build
