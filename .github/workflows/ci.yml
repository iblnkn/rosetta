name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: iblnkn/rosetta_ws/.github/workflows/reusable-ros-ci.yml@main
    with:
      package-name: rosetta
      upstream-repo-file: upstream.repos
