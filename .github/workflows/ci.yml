name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # industrial_ci is Docker-native: it pulls an official ROS image and builds
  # inside it, so there's no "is ROS actually installed on this runner" class
  # of bug to hand-roll around. rosdep resolves deps straight from
  # package.xml, and UPSTREAM_WORKSPACE pulls in direct deps the same way
  # upstream.repos used to, just inline.
  industrial_ci:
    runs-on: ubuntu-latest
    env:
      ROS_DISTRO: jazzy
      ROS_REPO: main
      # ament_python has no rosdep key of its own (it ships with the base ROS
      # install, unlike ament_cmake) — rosdep can't resolve it and industrial_ci
      # treats any unresolved key as fatal, so it has to be skipped explicitly.
      ROSDEP_SKIP_KEYS: ament_python
      UPSTREAM_WORKSPACE: "github:iblnkn/rosetta_interfaces#main"
    steps:
      - uses: actions/checkout@v4
      - uses: ros-industrial/industrial_ci@master

  # industrial_ci has no native ruff support (it predates ruff's dominance in
  # the Python-lint space) — kept as a separate job. ruff.toml is the
  # workspace's shared config; there's one copy (in rosetta_ws) rather than
  # duplicating it into every package repo.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -sfL https://raw.githubusercontent.com/iblnkn/rosetta_ws/main/ruff.toml -o ruff.toml
      - uses: astral-sh/ruff-action@v3
        with:
          # Pinned to the workspace pixi env's ruff so CI and `pixi run lint` agree.
          version: "0.15.21"
          args: check .
