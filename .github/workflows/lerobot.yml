name: lerobot

# industrial_ci builds and tests inside an official ROS Docker image; rosdep
# resolves dependencies from each package.xml. TARGET_WORKSPACE builds only
# this slice of the repository and the packages it depends on.
#
# Tests the newest LeRobot release the runner supports: 0.6.2 removes
# async_inference, which the runner uses until it is ported. The nightly run
# catches dependency changes that arrive without a change here.
on:
  pull_request:
    paths: [rosetta/**, robots/ros/**, policies/lerobot/**, .github/workflows/lerobot.yml]
  push:
    branches: [main, dev]
    paths: [rosetta/**, robots/ros/**, policies/lerobot/**, .github/workflows/lerobot.yml]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  industrial_ci:
    name: industrial_ci (lerobot)
    runs-on: ubuntu-latest
    env:
      ROS_DISTRO: jazzy
      ROS_REPO: main
      # ament_python has no rosdep key (it ships with base ROS), and
      # industrial_ci treats any unresolved key as fatal.
      ROSDEP_SKIP_KEYS: ament_python
      TARGET_WORKSPACE: "rosetta robots/ros policies/lerobot"
      # lerobot and torch have no rosdep keys. CPU torch keeps the image small.
      BEFORE_BUILD_TARGET_WORKSPACE: >-
        pip install --break-system-packages --ignore-installed 'lerobot[dataset]<0.6.2' torch
        --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
        && pip install --break-system-packages --ignore-installed --upgrade protobuf grpcio
    steps:
      - uses: actions/checkout@v4
      - uses: ros-industrial/industrial_ci@master
