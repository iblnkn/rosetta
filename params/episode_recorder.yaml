# Episode Recorder Node Parameters
# Usage:
#   ros2 launch rosetta episode_recorder_launch.py
#   Or with custom params:
#   ros2 run rosetta episode_recorder_node --ros-args \
#       --params-file /path/to/episode_recorder.yaml \
#       -p contract_path:=/path/to/contract.yaml

episode_recorder:
  ros__parameters:
    # Where to store recorded bag files. Relative paths resolve against the
    # current working directory (like `ros2 bag record`), so launching from
    # the workspace root records into <ws>/datasets/bags.
    bag_base_dir: "datasets/bags"

    # Rosbag storage format: "mcap" (recommended) or "sqlite3"
    storage_id: "mcap"

    # Record every topic on the graph (like `ros2 bag record -a`), not just
    # contract topics. Contract topics are always required; set false to
    # record only what the contract declares. Trim with exclude_topics.
    #
    # Auto-discovery stores ONE stream per camera. image_transport publishers
    # are lazy — every re-encoding encodes only while subscribed, so recording
    # all of them makes the camera node encode each frame several ways at once
    # (enough load to halve its capture rate). Per camera: contract-declared
    # or include_topics-matched streams win as-is; otherwise the best
    # advertised, non-excluded stream by preference
    # compressed > zstd > theora > compressedDepth > raw.
    record_all: true

    # Regex patterns (ros2 bag record --exclude syntax) for topics to always
    # auto-record — overrides exclude_topics and the per-camera policy above.
    # include_topics: ["/wrist_camera/image_raw$"]

    # Task prompt used when a goal or service call leaves prompt empty.
    # Empty means the bag stores no prompt, which is correct when the
    # contract declares a `tasks` section instead.
    default_prompt: ""

    # Default max episode duration in seconds (can be overridden per-episode)
    # 0 (or negative) = record until stopped, no time limit
    default_max_duration_s: 0.0

    # Rate at which to publish recording feedback (Hz)
    feedback_rate_hz: 2.0
