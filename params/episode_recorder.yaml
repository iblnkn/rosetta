# Episode Recorder Node Parameters
# Usage:
#   ros2 launch rosetta episode_recorder_launch.py
#   Or with custom params:
#   ros2 run rosetta episode_recorder_node --ros-args \
#       --params-file /path/to/episode_recorder.yaml \
#       -p contract_path:=/path/to/contract.yaml

episode_recorder:
  ros__parameters:
    # Where to store recorded bag files. Relative paths resolve against the
    # current working directory (like `ros2 bag record`), so launching from
    # the workspace root records into <ws>/datasets/bags.
    bag_base_dir: "datasets/bags"

    # Rosbag storage format: "mcap" (recommended) or "sqlite3"
    storage_id: "mcap"

    # Record every topic on the graph (like `ros2 bag record -a`), not just
    # contract topics. Contract topics are always required; set false to
    # record only what the contract declares. Trim with exclude_topics.
    record_all: true

    # Default max episode duration in seconds (can be overridden per-episode)
    # 0 (or negative) = record until stopped, no time limit
    default_max_duration: 0.0

    # Rate at which to publish recording feedback (Hz)
    feedback_rate_hz: 2.0

    # Default QoS queue depth for topic subscriptions
    default_qos_depth: 10
