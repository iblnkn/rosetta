# Rosetta HIL Launch Configuration
#
# This file is the single source of truth for all defaults in hil_launch.py.
# It has a top-level contract_path shared by all nodes, plus four sections:
#
#   hil_manager     - HilManagerNode parameters
#   robot_policy    - policy_runner_node parameters (merged over policy_runner.yaml)
#   episode_recorder - episode_recorder_node parameters (merged over episode_recorder.yaml)
#   reward_classifier - policy_runner_node (classifier) parameters
#
# Any value set here overrides the corresponding node's own YAML defaults.
# CLI arguments override everything:
#
#   ros2 launch rosetta hil_launch.py enable_reward_classifier:=false
#   ros2 launch rosetta hil_launch.py pretrained_name_or_path:=/path/to/model

# Contract used by all nodes in this launch (hil_manager, robot_policy, episode_recorder,
# and reward_classifier all read from the same contract).
# Omitted by default: the launch file falls back to the installed
# <rosetta share>/contracts/so_101_hil.yaml via the ament index.
# Uncomment to point all nodes at a custom contract:
# contract_path: "/path/to/custom_contract.yaml"

# ==============================================================================
# HIL Manager
# ==============================================================================

hil_manager:
  ros__parameters:
    # Whether to use a reward classifier policy (requires separate contract + model).
    # Off by default: most setups don't have a trained classifier yet, and
    # forgetting to pass enable_reward_classifier:=false crashes the second
    # policy_runner_node looking for a model path that doesn't exist.
    enable_reward_classifier: false

    # Whether to record episodes to a bag. Defaults true. When false, episode
    # start/stop, labeling, and intervention all behave identically; only the
    # bag write is skipped.
    enable_recording: true

    # Whether hil_manager owns the policy's lifecycle: send a RunPolicy goal
    # at episode start, cancel it at episode end. False assumes a policy is
    # already running (started some other way) and hil_manager just
    # mux/records/labels around it -- it never sends or cancels a goal.
    manage_policy_lifecycle: true

    # Task prompt used when an episode is started via the start_episode
    # teleop event (a button press carries no text input).
    default_episode_prompt: ""

    # Action names for child node action clients
    # These must match the namespaced action names from the launch file
    policy_action_name: "/robot_policy/run_policy"
    reward_classifier_action_name: "/reward_classifier/run_policy"
    recorder_action_name: "/record_episode"

    # Topic prefix applied to remapped policy output
    # The robot policy policy_runner_node publishes to {prefix}{original_topic}
    # The HIL manager subscribes there and forwards to the original topic
    policy_remap_prefix: "/hil/policy"

    # Topic prefix applied to remapped reward classifier output
    reward_remap_prefix: "/hil/reward"

    # --- Environment reset (planned, not yet implemented) ---
    # Between-episode reset for HIL-SERL workflows. This lived in the contract
    # as a `reset:` section but was dead weight there (nothing consumed it);
    # it is operational config for THIS node, so it will land here when the
    # reset flow is built:
    # reset_mode: "manual"            # manual | service | topic
    # reset_service: "/environment/reset"
    # reset_service_type: "std_srvs/srv/Trigger"
    # reset_time_s: 5.0

    # Reward values assigned when the human presses override buttons.
    # human_reward_negative is a distinct negative sentinel, not 0.0 -- an
    # explicit failure label must be distinguishable in the recorded reward
    # stream from an episode nobody labeled (which stays at the neutral 0.0
    # default), or you can't filter one from the other later.
    human_reward_positive: 1.0
    human_reward_negative: -1.0

    # Rate at which to publish ManageEpisode feedback (Hz)
    feedback_rate_hz: 30.0

    # Default max episode duration in seconds
    # (used when a ManageEpisode request does not specify max_duration_s)
    # 0 (or negative) = run until stopped, no time limit
    default_max_duration: 0.0

# ==============================================================================
# Robot Policy  (policy_runner_node, namespace: robot_policy)
# Merged over policy_runner.yaml — values here take precedence.
# ==============================================================================

robot_policy:
  ros__parameters:
    # Path to trained policy model (local path or HuggingFace repo_id).
    # Relative paths resolve against the launch cwd — launch from the
    # workspace root, or override on the CLI with pretrained_name_or_path:=...
    pretrained_name_or_path: "models/ACT/checkpoints/last/pretrained_model"

    # LeRobot policy server address (host:port)
    server_address: "127.0.0.1:8080"

    # Policy architecture type
    policy_type: "act"

    # Device for policy inference
    policy_device: "cuda"

    # Number of actions to request per inference chunk
    actions_per_chunk: 30

    # Threshold for when to request a new action chunk (0.0 - 1.0)
    chunk_size_threshold: 0.95

    # How to aggregate overlapping action chunks
    aggregate_fn_name: "weighted_average"

    # Observation similarity filtering tolerance (-1.0 to disable)
    obs_similarity_atol: -1.0

# ==============================================================================
# Episode Recorder  (episode_recorder_node)
# Merged over episode_recorder.yaml — values here take precedence.
# ==============================================================================

episode_recorder:
  ros__parameters:
    # Where to store recorded bag files (relative = launch cwd, like
    # `ros2 bag record`)
    bag_base_dir: "datasets/bags"

    # Rosbag storage format: "mcap" (recommended) or "sqlite3"
    storage_id: "mcap"

    # Default max episode duration in seconds
    # 0 (or negative) = record until stopped, no time limit
    default_max_duration: 0.0

# ==============================================================================
# Reward Classifier  (policy_runner_node, namespace: reward_classifier)
# Only used when enable_reward_classifier: true.
# Starts from policy_runner.yaml base, values here take precedence.
# ==============================================================================

reward_classifier:
  ros__parameters:
    # Path to trained reward classifier model (required when enabled).
    # Relative paths resolve against the launch cwd.
    pretrained_name_or_path: "checkpoints/reward_classifier"

    # Policy server address for the reward classifier (separate port from robot policy)
    server_address: "127.0.0.1:8081"

    # Policy type for the reward classifier model
    policy_type: "reward_classifier"

    # Contract path for reward classifier (empty = use main contract_path)
    contract_path: ""
